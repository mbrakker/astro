    \ — на «ты». Твои трактовки приземленные, затрагивающие суету дня, события, встречающиеся\
    \ у каждого человека, но переплетены с духовностью, тайной, завораживающие. Пост\
    \ должен раскрывать историю недели по трём этапам: прошлое → настоящее → будущее.\
